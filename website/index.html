<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTT24x7 | Premium Digital Subscriptions</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
:root{--bg:#0d0f14;--card:#111318;--accent:#ff2d55;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden;}
.glass{background:rgba(255,255,255,0.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);}
.gradient-text{background:linear-gradient(90deg,#ff4d4d,#f9cb28,#20e3b2,#2196f3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.drawer{position:fixed;top:0;right:-100%;width:100%;max-width:420px;height:100%;background:var(--card);z-index:110;transition:0.4s;box-shadow:-10px 0 40px rgba(0,0,0,0.6);overflow-y:auto;}
.drawer.active{right:0;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;opacity:0;pointer-events:none;transition:0.3s;}
.overlay.active{opacity:1;pointer-events:all;}
.view-content{display:none;animation:fadeIn .4s ease;}
.view-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse-glow{animation:pulseGlow 2s infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(233,30,99,0.4)}50%{box-shadow:0 0 20px 4px rgba(233,30,99,0.1)}}
.toast-container{position:fixed;top:90px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:#1a1c22;border-left:3px solid #ff2d55;padding:14px 20px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5);font-size:12px;font-weight:600;transform:translateX(120%);transition:transform .4s;max-width:320px;}
.toast.show{transform:translateX(0);}
.toast.success{border-left-color:#4ade80;}
.mobile-menu{position:fixed;top:0;left:-100%;width:80%;max-width:300px;height:100%;background:var(--card);z-index:110;transition:0.4s;padding:24px;}
.mobile-menu.active{left:0;}
.product-card{transition:all .3s ease;}
.product-card:hover{transform:translateY(-6px);}
::-webkit-scrollbar{width:6px;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:#333;border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#ff2d55;border-radius:50%;cursor:pointer;}
.tab-btn{position:relative;padding-bottom:8px;cursor:pointer;transition:color .3s;}
.tab-btn::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:#ff2d55;transition:width .3s;}
.tab-btn.active{color:#ff2d55;}
.tab-btn.active::after{width:100%;}
.tab-content{display:none;animation:fadeIn .3s ease;}
.tab-content.active{display:block;}
.loader{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#ff2d55;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeAllDrawers()"></div>
<div class="toast-container" id="toast-container"></div>
<div class="mobile-menu" id="mobile-menu"></div>
<div class="drawer" id="cart-drawer"></div>
<div class="drawer" id="login-drawer"></div>
<div class="drawer" id="register-drawer"></div>
<nav id="main-nav"></nav>
<div id="app-views"></div>
<footer id="main-footer" class="mt-20"></footer>
<script src="app.js"></script>
</body>
</html>
